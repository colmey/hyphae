# MCP server configuration for the harness.
#
# Supported transports:
#   - streamable-http: modern MCP HTTP transport (recommended for new servers)
#   - sse:             older SSE-based HTTP transport
#   - stdio:           local subprocess (command/args/env) -- not used yet
#
# Per-server fields:
#   transport       (required) one of the above
#   url             (required for streamable-http and sse)
#   command, args, env  (required for stdio)
#   disabled        (optional, default false) skip this server entirely
#   disabled_tools  (optional) list of tool names to hide from the LLM
#
# String values support ${ENV_VAR} interpolation; the host/port for each
# server lives in the .env file so this config carries no environment
# specifics. A referenced var that is unset raises a clear error at startup.

# No MCP servers are running locally right now, so both are disabled. Flip
# `disabled: false` (and start the server) to re-enable. With both disabled the
# harness runs tool-less; the model answers from its own knowledge.
mcpServers:
  google-toolbox:
    transport: streamable-http
    url: ${GOOGLE_TOOLBOX_URL}
    disabled: true
    disabled_tools: []

  open-websearch:
    transport: streamable-http
    url: ${OPEN_WEBSEARCH_URL}
    disabled: false
    disabled_tools:
     - fetchJuejinArticle
     - fetchCsdnArticle
     - fetchLinuxDoArticle

# Tool-dispatch policy: what may EXECUTE (enforcement at dispatch), distinct from
# what the model SEES (orchestrator selection + per-server disabled_tools above).
#   mode: allow_all  -> every tool runs (default; omit this block for the same effect)
#         allow_list -> only tools whose namespaced name matches an `allow` pattern
#                       run; anything else is denied at dispatch with a teaching
#                       result the model can adapt to (deny != run failure).
# Patterns are fnmatch globs over `{server}__{tool}` names. An allow_list with an
# empty `allow` fails loudly at startup (it would silently deny everything).
tool_policy:
  mode: allow_all
  allow: []
  # Example allow-list (uncomment to enforce):
  # mode: allow_list
  # allow:
  #   - "open-websearch__*"