# Model registry for the orchestrator.
#
# Each entry defines a routable model the orchestrator can select. The
# `description` field is what the orchestrator LLM sees when deciding which
# model fits the user's request — write it for an LLM audience.
#
# `provider` is fed into the same factory used elsewhere (build_llm_client_
# from_entry), so any provider supported by hyphae/llm/client.py works here.
#
# Per-entry fields:
#   provider        (required)  one of: gemini, openai_compatible
#                               (`openai` remains a compatibility alias)
#   model           (required)  provider-specific model identifier
#   description     (required)  human/LLM-readable summary of strengths
#   max_tokens      (optional)  per-model output cap; falls back to Settings
#   context_window  (optional)  total context window in tokens; used by the
#                               agent loop's context budget (window - max
#                               output - safety margin). Falls back to
#                               Settings.context_default_window_tokens.
#                               Set it accurately for small local models.
#   supports_native_tools
#                   (optional)  whether the served endpoint supports native
#                               tool/function calling. Defaults to true.
#                               Set false for prose-only models to use the
#                               prompted-tool adapter.
#   thinking        (optional)  one of: none, hint-param, think-tags.
#                               Defaults to none. Use hint-param for endpoints
#                               that accept a request knob such as
#                               reasoning_effort; use think-tags for models
#                               that self-emit leading <think>...</think>.
#   sampling        (optional)  per-model provider request sampling:
#                               temperature (0.0-2.0), top_p (0.0-1.0),
#                               top_k (>=1). Omit a field to leave the
#                               provider/server default in force.
#   default         (optional)  exactly one entry may be marked default: true.
#                               Used as the fallback when orchestration fails
#                               and as the orchestrator's own model unless
#                               overridden by Settings.orchestrator_model_id.

models:
  # gemini-flash:
  #   provider: gemini
  #   model: gemini-3-flash-preview
  #   description: >
  #     Fast, cost-efficient. Best for straightforward queries, lookups,
  #     single-tool calls, and short summaries. Use by default unless the
  #     task clearly needs deeper reasoning.

  # gemini-pro:
  #   provider: gemini
  #   model: gemini-3.1-pro-preview
  #   description: >
  #     Heavyweight advanced reasoning model. Select this ONLY for complex
  #     logic puzzles, zero-shot architectural design, advanced mathematics,
  #     deep analytical work, or highly ambiguous workflows demanding the
  #     deepest level of deliberate planning.

  # Local model served via the `openai_compatible` provider.
  # Set OPENAI_COMPAT_BASE_URL and OPENAI_API_KEY in the environment.
  # `model` must match a tools-capable model if you want tool calling.
  # qwen3.6:
  #   provider: openai_compatible
  #   model: qwen3.6-35b-a3b
  #   description: >
  #     Local Qwen3.6 model served over the OpenAI-compatible endpoint.
  #     Suitable for complex reasoning and tool calling tasks.
  #   supports_native_tools: true
  #   thinking: think-tags
  #   sampling:
  #     temperature: 0.6
  #     top_p: 0.95
  #     top_k: 20

  # weak-local-prompted:
  #   provider: openai_compatible
  #   model: small-local-model
  #   description: >
  #     Local prose-only model with no reliable native tool calling. Uses the
  #     prompted-tool adapter selected by supports_native_tools: false.
  #   supports_native_tools: false
  #   thinking: none
  #   context_window: 32768
  #   max_tokens: 4096

  gpt-oss-20b:
    provider: openai_compatible
    model: gpt-oss-20b
    description: >
      GPT-OSS-20B is a powerful general-purpose model offering a balance between performance and cost.
      It excels at complex reasoning, code generation, and tool-calling. Suitable for a wide range of LLM tasks,
      from natural language understanding to advanced problem solving.
    supports_native_tools: true
    context_window: 131072

  glm-4.7-flash:
    provider: openai_compatible
    model: glm-4.7-flash
    description: >
      GLM-4.7-Flash, a 30B-A3B mixture-of-experts model tuned for general agentic
      reasoning. A strong, well-rounded choice for complex multi-step reasoning,
      planning, and tool-calling across mixed workloads. Prefer it when the task needs
      solid reasoning but is not specifically coding-focused.
    supports_native_tools: true
    context_window: 65536
    max_tokens: 16384

  qwen3.6-35b-a3b:
    provider: openai_compatible
    model: qwen3.6-35b-a3b
    description: >
      Qwen3.6-35B-A3B, a mixture-of-experts reasoning model specialized for agentic
      coding. A heavy, deliberate reasoner that emits extended thinking before
      answering. Select for complex code generation, multi-step engineering tasks, and
      demanding tool-driven workflows.
    supports_native_tools: true
    context_window: 65536
    max_tokens: 16384

  qwen3.5-9b:
    provider: openai_compatible
    model: qwen3.5-9b
    description: >
      Qwen3.5-9B, a compact dense reasoning model with hybrid attention and a very long
      (200K token) context window; multimodal-capable architecture, currently wired
      text-only. Fast and efficient. Prefer for long-context tasks, document analysis,
      and lighter reasoning where a large model is unnecessary.
    supports_native_tools: true
    context_window: 204800
    max_tokens: 32768

  ornith-1.0-9b:
    provider: openai_compatible
    model: ornith-1.0-9b
    description: >
      Ornith-1.0-9B, a Qwen3.5-9B fine-tune specialized for agentic coding, with a very
      long (200K token) context window and always-on step-by-step reasoning. Prefer for
      coding and tool-use tasks that need a fast, small model with a large context
      window.
    supports_native_tools: true
    context_window: 204800
    max_tokens: 32768
    default: true

  ornith-1.0-35b:
    provider: openai_compatible
    model: ornith-1.0-35b
    description: >
      Ornith-1.0-35B, a mixture-of-experts agentic-coding model and direct peer to
      qwen3.6-35b-a3b, with an extremely long (256K token) context window and always-on
      reasoning. Select for large-context, complex agentic coding and multi-step
      engineering workflows.
    supports_native_tools: true
    context_window: 262144
    max_tokens: 32768
